# `name` value will appear "as is" in the badge.
# See https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#adding-a-workflow-status-badge-to-your-repository
name: "build"

on:
  push:
    branches:
    - tcc-1.9
    tags:
    - '**'
  pull_request:
    branches:
    - '**'

jobs:

  config:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.config.outputs.image }}
      tag: ${{ steps.git.outputs.tag }}

    steps:
    - name: "Checkout"
      uses: actions/checkout@v2

    - id: config
      run: |
        source common/scripts/setup_env.sh
        echo "::set-output name=image::${IMG}" # ISTIO_BUILD_TOOLS

    - id: git
      run: |
        TAG=
        if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
          TAG=$( echo "${GITHUB_REF}" | tail -c +11 )
        fi
        echo "::set-output name=tag::${TAG}"

  build:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # fetch all history for all tags and branches

    - run: make -e T=-v build binaries-test

  unit-tests:
    needs: config
    runs-on: ubuntu-latest

    strategy:
      matrix:
        with_modsecurity: ["without_modsecurity", "with_modsecurity"]

    container:
      image: ${{ needs.config.outputs.image }} # ISTIO_BUILD_TOOLS
      env:
        BUILD_WITH_CONTAINER: "0"
        GOOGLE_APPLICATION_CREDENTIALS: /gcs.key.json

    steps:
    # The make targets need .git folder, which is missing without installing a newer git command
    # https://github.com/actions/checkout/issues/335
    - name: "Install latest `git`"
      run: |
        apt-get purge git -y
        add-apt-repository ppa:git-core/ppa -y
        apt-get update && apt-get install -y --no-install-recommends \
            git \
          && apt-get clean \
          && rm -rf /var/lib/apt/lists/*
    - name: "Checkout"
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # fetch all history for all tags and branches

    - name: "GCS Credentials"
      env:
        GCS_CREDENTIALS: ${{ secrets.TETRATE_CI_GCS_CREDENTIALS }}
      run: |
        echo "${GCS_CREDENTIALS}" | base64 -d > ${GOOGLE_APPLICATION_CREDENTIALS}
        gcloud auth activate-service-account --key-file="${GOOGLE_APPLICATION_CREDENTIALS}"

    - name: "Download Envoy, Wasm plugins, and ModSecurity resources"
      env:
        WITH_MODSECURITY: ${{ matrix.with_modsecurity }}
      run: |
        make -e T=-v init

    # Currently, ModSecurity requires runtime shared libraries, so copy them into the system's
    # library directories. This part can be omitted after we make ModSecuirty fully statically
    # compiled.
    - name: "Copy ModSecurity dependencies"
      if: ${{ matrix.with_modsecurity == 'with_modsecurity' }}
      run: |
        cd out/linux_amd64/release/modsecurity_plugin_deps
        cp -r --parents -n ./* /

    - name: "Run Tests"
      env:
        WITH_MODSECURITY: "with_modsecurity"
      run: |
        make -e T=-v racetest

  release:
    needs: config
    runs-on: [self-hosted, linux, x64, medium] # we use a self-host runner here to get more disk space

    strategy:
      matrix:
        with_modsecurity: ["without_modsecurity", "with_modsecurity"]

    container:
      image: ${{ needs.config.outputs.image }} # ISTIO_BUILD_TOOLS
      env:
        BUILD_WITH_CONTAINER: "0"
        GOOGLE_APPLICATION_CREDENTIALS: /gcs.key.json

    steps:
    # The makefiles need .git folder, which is missing without installing a newer git command
    # https://github.com/actions/checkout/issues/335
    - name: "Install latest `git`"
      run: |
        apt-get purge git -y
        add-apt-repository ppa:git-core/ppa -y
        apt-get update && apt-get install -y --no-install-recommends \
            git \
          && apt-get clean \
          && rm -rf /var/lib/apt/lists/*

    - name: "Checkout"
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # fetch all history for all tags and branches

    - name: "Docker login"
      env:
        DOCKER_HUB_USER: ${{ secrets.TETRATE_CI_DOCKER_HUB_USER }}
        DOCKER_HUB_PASSWORD: ${{ secrets.TETRATE_CI_DOCKER_HUB_PASSWORD }}
      run: docker login --username "${DOCKER_HUB_USER}" --password "${DOCKER_HUB_PASSWORD}"

    - name: "GCS Credentials"
      env:
        GCS_CREDENTIALS: ${{ secrets.TETRATE_CI_GCS_CREDENTIALS }}
      run: |
        echo "${GCS_CREDENTIALS}" | base64 -d > ${GOOGLE_APPLICATION_CREDENTIALS}
        gcloud auth activate-service-account --key-file="${GOOGLE_APPLICATION_CREDENTIALS}"

    - name: "GitHub PAT for Istio release-builder"
      env:
        GITHUB_TOKEN: ${{ secrets.TETRATE_CI_GITHUB_TOKEN }}
      run: |
        echo -e "machine github.com\nlogin tetrate-ci\npassword ${GITHUB_TOKEN}" > "${HOME}/.netrc"

    - name: "Run prow/release-commit.sh"
      env:
        DOCKER_HUB: ${{ secrets.TETRATE_CI_DOCKER_HUB }}
        GCS_BUCKET: ${{ secrets.TETRATE_CI_GCS_BUCKET }}
        PUBLISH_GCS_ALIASES: "0" # don't publish aliases to GCS
        VERSION: ${{ needs.config.outputs.tag }}
        VERSION_SUFFIX_MODSEC: -modsecurity
        WITH_MODSECURITY: ${{ matrix.with_modsecurity }}
        BUILD_OUTPUTS_OVERRIDE_MODSEC:
          | # ModSecurity version doesn't build .deb and .rpm currently
          buildOutputs:
            - docker
            - archive
      shell: bash
      run: |
        if [[ "${WITH_MODSECURITY}" = "with_modsecurity" ]]; then
          export BUILD_OUTPUTS_OVERRIDE="${BUILD_OUTPUTS_OVERRIDE_MODSEC}"
          if [[ -z "${VERSION}" ]]; then
            export VERSION_SUFFIX="${VERSION_SUFFIX_MODSEC}"
          else
            export VERSION="${VERSION}${VERSION_SUFFIX_MODSEC}"
          fi
        fi
        prow/release-commit.sh

  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v2

    - run: make lint

  gencheck:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v2

    - run: make gen-check

  analyze-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v2

    - run: make test.integration.analyze
