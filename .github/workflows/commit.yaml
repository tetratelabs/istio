# `name` value will appear "as is" in the badge.
# See https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#adding-a-workflow-status-badge-to-your-repository
name: "build"

on:
  push:
    branches:
    - tcc
  pull_request:
    branches:
    - '**'

jobs:

  build:
    runs-on: ubuntu-latest # `build` step is relatively fast, thus GitHub-hosted runner is enough

    steps:
    - name: "Checkout"
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # fetch all history for all tags and branches

    - run: make -e T=-v build binaries-test

  unit-tests:
    runs-on: [self-hosted, linux, x64, medium]

    steps:
    - name: "Checkout"
      uses: actions/checkout@v2

    - run: make -e T=-v init racetest

  release-test:
    runs-on: [self-hosted, linux, x64, medium]

    container:
      image: docker.io/yskopets/build-tools:release-1.7-2020-10-12T16-50-25 # IMG
      env:
        BUILD_WITH_CONTAINER: "0"

    steps:
    - name: "Checkout"
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # fetch all history for all tags and branches

    - run: prow/release-test.sh

  lint:
    runs-on: [self-hosted, linux, x64, medium]

    steps:
    - name: "Checkout"
      uses: actions/checkout@v2

    - run: make lint

  gencheck:
    runs-on: [self-hosted, linux, x64, medium]

    steps:
    - name: "Checkout"
      uses: actions/checkout@v2

    - run: make gen-check
